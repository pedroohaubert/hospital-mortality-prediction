[project]
name = "tabpfn-exp"
version = "0.1.0"
description = "Experimento isolado do TabPFN v2. Não faz parte do treino entregue."
requires-python = ">=3.12,<3.13"
dependencies = [
  "desfecho",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "tabpfn==9.2.0",
  "torch==2.14.1",
]

[tool.uv]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64' and python_full_version == '3.12.*'",
]

[project.scripts]
tabpfn-exp = "tabpfn_exp.cli:main"

[tool.uv.sources]
desfecho = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tabpfn_exp"]
